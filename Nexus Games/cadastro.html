<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="img/ícones/Logo Nexus.png" type="image/png">
    <title>Cadastro - Nexus Games</title>
</head>

<body class="login-page">

    <div class="login-container">

        <a href="index.html">
            <img src="img/ícones/Logo Nexus.png"
                 alt="Nexus Games"
                 class="login-logo">
        </a>

        <h1 class="login-title">Criar conta</h1>

        <p class="login-subtitle">
            Cadastre-se na Nexus Games 🎮
        </p>

        <form id="cadastro-form" action="salvar_usuarios.php" method="POST">

            <label for="nome">Nome completo</label>
            <input type="text" id="nome" name="nome"
                   placeholder="Seu nome completo" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email"
                   placeholder="seu@email.com" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha"
                   placeholder="Crie uma senha" minlength="4" required>

            <label for="cpf">CPF</label>
            <input type="text" id="cpf" name="cpf"
                   placeholder="000.000.000-00"
                   maxlength="14"
                   required>

            <label for="endereco">Endereço</label>
            <input type="text" id="endereco" name="endereco"
                   placeholder="Rua, número..." required>

            <label for="bairro">Bairro</label>
            <input type="text" id="bairro" name="bairro"
                   placeholder="Seu bairro" required>

            <label for="cidade">Cidade</label>
            <input type="text" id="cidade" name="cidade"
                   placeholder="Sua cidade" required>

            <label for="estado">Estado</label>
            <input type="text" id="estado" name="estado"
                   placeholder="BA" maxlength="2" required>

            <label for="cep">CEP</label>
            <input type="text" id="cep" name="cep"
                   placeholder="00000000" maxlength="8" required>

            <button type="submit" class="login-btn">
                Criar conta
            </button>

        </form>

        <p class="login-footer">
            Já tem uma conta?
            <a href="login.html">Entrar</a>
        </p>

        <p class="login-voltar">
            <a href="index.html">← Voltar para a loja</a>
        </p>

    </div>
    <script src="js/scripts.js"></script>

</body>
</html>
